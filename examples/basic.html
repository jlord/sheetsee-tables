<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>sheetsee-tables basic example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }

      table {
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 0.5rem 0.75rem;
      }

      .tHeader {
        cursor: pointer;
      }

      .table-pagination {
        margin-top: 1rem;
      }

      .table-pagination a {
        cursor: pointer;
        margin-left: 0.5rem;
      }

      .no-pag {
        color: #999;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Favorite Places</h1>
    <input id="siteTableFilter" type="text" placeholder="filter by city, place, or year">
    <a href="#" class="clear">Clear</a>
    <div id="siteTable"></div>

    <script id="siteTable_template" type="text/html">
      <table>
        <tr>
          <th class="tHeader">City</th>
          <th class="tHeader">Place Name</th>
          <th class="tHeader">Year</th>
        </tr>
        {{#rows}}
          <tr>
            <td>{{City}}</td>
            <td>{{PlaceName}}</td>
            <td>{{Year}}</td>
          </tr>
        {{/rows}}
      </table>
    </script>

    <script src="../test/sheetsee.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var data = [
          { City: 'Oakland', PlaceName: 'Lake Merritt', Year: '1870' },
          { City: 'Portland', PlaceName: 'Forest Park', Year: '1948' },
          { City: 'Seattle', PlaceName: 'Gas Works Park', Year: '1975' },
          { City: 'Chicago', PlaceName: 'Millennium Park', Year: '2004' }
        ]

        var tableOptions = {
          data: data,
          pagination: 2,
          tableDiv: '#siteTable',
          filterDiv: '#siteTableFilter'
        }

        Sheetsee.makeTable(tableOptions)
        Sheetsee.initiateTableFilter(tableOptions)
      })
    </script>
  </body>
</html>
