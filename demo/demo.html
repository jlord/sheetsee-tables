<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sheetsee Tables Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th.tHeader { cursor: pointer; background: #f5f5f5; user-select: none; }
    th.tHeader:hover { background: #e0e0e0; }
    .table-pagination { margin: 10px 0; font-size: 14px; color: #666; }
    .pagination-next, .pagination-pre { cursor: pointer; color: #0366d6; margin: 0 5px; }
    .pagination-next:hover, .pagination-pre:hover { text-decoration: underline; }
    .no-pag { color: #ccc !important; cursor: default !important; }
    #searchInput { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; width: 200px; font-size: 14px; }
    .clear { margin-left: 8px; color: #0366d6; cursor: pointer; text-decoration: none; }
    .clear:hover { text-decoration: underline; }
    h1 { color: #333; }
    h2 { color: #555; margin-top: 30px; }
    pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px; padding: 12px; overflow-x: auto; font-size: 13px; }
    code { background: #f6f8fa; padding: 2px 4px; border-radius: 3px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>📊 Sheetsee Tables Demo</h1>
  <p>This demo shows how to use sheetsee-tables with sample data. The table below is sortable, searchable, and paginated.</p>

  <h2>Step 1: Search / Filter</h2>
  <input id="siteTableFilter" type="text" placeholder="Filter by name, city or year..." id="searchInput">
  <a href="#" class="clear">Clear</a>

  <h2>Step 2: The Table</h2>
  <p>Click on column headers to sort. Use Previous/Next to paginate.</p>
  <div id="siteTable"></div>

  <!-- Template -->
  <script id="siteTable_template" type="text/html">
    <table>
      <tr>
        <th class="tHeader">City</th>
        <th class="tHeader">Place Name</th>
        <th class="tHeader">Year</th>
        <th class="tHeader">Category</th>
      </tr>
      {{#rows}}
        <tr>
          <td>{{city}}</td>
          <td>{{placename}}</td>
          <td>{{year}}</td>
          <td>{{category}}</td>
        </tr>
      {{/rows}}
    </table>
  </script>

  <!-- Sheetsee library -->
  <script src="bundle.js"></script>
  <script>
    // Sample data — in a real project this would come from Tabletop.js + Google Sheets
    var data = [
      { city: "San Francisco", placename: "Golden Gate Bridge", year: 1937, category: "Landmark" },
      { city: "New York", placename: "Empire State Building", year: 1931, category: "Landmark" },
      { city: "Paris", placename: "Eiffel Tower", year: 1889, category: "Landmark" },
      { city: "London", placename: "Tower Bridge", year: 1894, category: "Landmark" },
      { city: "Tokyo", placename: "Senso-ji Temple", year: 645, category: "Temple" },
      { city: "Beijing", placename: "Great Wall", year: 1368, category: "Landmark" },
      { city: "Sydney", placename: "Opera House", year: 1973, category: "Venue" },
      { city: "Rome", placename: "Colosseum", year: 80, category: "Landmark" },
      { city: "Barcelona", placename: "Sagrada Familia", year: 1882, category: "Church" },
      { city: "Dubai", placename: "Burj Khalifa", year: 2010, category: "Landmark" },
      { city: "Mumbai", placename: "Gateway of India", year: 1924, category: "Monument" },
      { city: "Cairo", placename: "Pyramids of Giza", year: -2560, category: "Landmark" },
      { city: "Rio de Janeiro", placename: "Christ the Redeemer", year: 1931, category: "Landmark" },
      { city: "Amsterdam", placename: "Anne Frank House", year: 1635, category: "Museum" },
      { city: "Berlin", placename: "Brandenburg Gate", year: 1791, category: "Monument" }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      var tableOptions = {
        "data": data,
        "pagination": 5,
        "tableDiv": "#siteTable",
        "filterDiv": "#siteTableFilter",
        "templateID": "siteTable_template"
      }
      Sheetsee.makeTable(tableOptions)
      Sheetsee.initiateTableFilter(tableOptions)
    })
  </script>
</body>
</html>
